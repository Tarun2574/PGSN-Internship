apiVersion: v1
kind: Namespace

metadata:

  name: taskflow


---

apiVersion: v1
kind: ConfigMap

metadata:

  name: taskflow-config

  namespace: taskflow


data:

  APP_NAME: "TaskFlow"

  ENVIRONMENT: "production"

  PORT: "5000"


---

apiVersion: v1
kind: Secret

metadata:

  name: taskflow-secret

  namespace: taskflow


type: Opaque


data:

  app-secret: dGFza2Zsb3ctc2VjcmV0


---

apiVersion: v1
kind: PersistentVolume

metadata:

  name: taskflow-pv


spec:

  capacity:

    storage: 1Gi


  accessModes:

    - ReadWriteOnce


  hostPath:

    path: /data/taskflow


  persistentVolumeReclaimPolicy: Retain


---

apiVersion: v1
kind: PersistentVolumeClaim

metadata:

  name: taskflow-pvc

  namespace: taskflow


spec:

  accessModes:

    - ReadWriteOnce


  resources:

    requests:

      storage: 1Gi


---

apiVersion: apps/v1
kind: Deployment

metadata:

  name: taskflow-deployment

  namespace: taskflow


spec:

  replicas: 2


  selector:

    matchLabels:

      app: taskflow


  template:

    metadata:

      labels:

        app: taskflow


    spec:

      containers:

        - name: taskflow

          image: mtarunkumar/taskflow:latest

          imagePullPolicy: Always


          ports:

            - containerPort: 5000


          envFrom:

            - configMapRef:

                name: taskflow-config


            - secretRef:

                name: taskflow-secret


          volumeMounts:

            - name: task-data

              mountPath: /app/data


      volumes:

        - name: task-data

          persistentVolumeClaim:

            claimName: taskflow-pvc


---

apiVersion: v1
kind: Service

metadata:

  name: taskflow-service

  namespace: taskflow


spec:

  type: NodePort


  selector:

    app: taskflow


  ports:

    - port: 5000

      targetPort: 5000

      nodePort: 30080